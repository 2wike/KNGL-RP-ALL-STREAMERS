<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KNGL RP – All Streamers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- INTRO SPLASH -->
  <div id="intro-splash">
    <div class="splash-inner">
      <p class="splash-eyebrow">GTA FiveM Roleplay</p>
      <h1 class="splash-title">KNGL RP</h1>
      <p class="splash-sub">ALL STREAMERS</p>
    </div>
  </div>

  <!-- NAVBAR -->
  <nav id="navbar">
    <div class="nav-inner">
      <a class="nav-brand" href="index.html">
        <span class="brand-main">KNGL RP</span>
        <span class="brand-sep">·</span>
        <span class="brand-label">All Streamers</span>
      </a>
      <div class="nav-right">
        <div id="live-count-badge" class="live-badge hidden">
          <span class="live-dot"></span>
          <span id="live-count-text">0 canlı</span>
        </div>
        <button id="report-btn" class="report-btn" title="Sorun Bildir">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>Bildir</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- MODAL -->
  <div id="report-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <button class="modal-close" id="modal-close-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <h2 class="modal-title">Geliştiriciyle İletişim</h2>
      <p class="modal-desc">Bir sorun mu var, eksik yayıncı mı fark ettin? Bize ulaş.</p>
      <form id="report-form" class="report-form" onsubmit="submitForm(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="f-name">İsim</label>
            <input type="text" id="f-name" placeholder="Adın" required />
          </div>
          <div class="form-group">
            <label for="f-surname">Soyisim</label>
            <input type="text" id="f-surname" placeholder="Soyadın" required />
          </div>
        </div>
        <div class="form-group">
          <label for="f-email">E-posta</label>
          <input type="email" id="f-email" placeholder="ornek@mail.com" required />
        </div>
        <div class="form-group">
          <label for="f-note">Mesaj</label>
          <textarea id="f-note" placeholder="Sorununu veya önerini yaz…" rows="4" required></textarea>
        </div>
        <button type="submit" class="form-submit">Gönder</button>
      </form>
      <div id="form-success" class="form-success hidden">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <p>Mesajın alındı, teşekkürler!</p>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <main id="main-content">
    <div class="content-header">
      <div class="header-left">
        <h2 class="page-title">Canlı Yayınlar</h2>
        <span id="status-count" class="count-pill">—</span>
      </div>
      <div class="header-right">
        <span class="refresh-hint"><span id="countdown">60</span>s</span>
        <button class="icon-btn" onclick="loadStreamers()" title="Şimdi yenile">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="streamers-grid" class="streamers-grid">
      <div class="loading-state">
        <div class="spinner"></div>
        <span>Yayınlar kontrol ediliyor…</span>
      </div>
    </div>

    <div id="offline-section" class="offline-section hidden">
      <div class="section-label">
        <span>Çevrimdışı Yayıncılar</span>
      </div>
      <div id="offline-grid" class="streamers-grid offline-grid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <span>KNGL RP All Streamers</span>
  </footer>

  <script src="streamers.js"></script>
  <script src="app.js"></script>
</body>
</html>
